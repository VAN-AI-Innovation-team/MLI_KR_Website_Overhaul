<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MLI 회원 로그인 시연" />
    <title>MLI 로그인</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="login-card" aria-labelledby="title">
      <a class="logo" href="/" aria-label="MLI 홈">MLI<span>.</span></a>
      <section id="login-panel">
        <h1 id="title">로그인</h1>
        <p class="description">MLI에 오신 것을 환영합니다.</p>
        <button class="google-button" type="button" disabled>
          <span class="google-letter" aria-hidden="true">G</span>
          Google로 로그인
        </button>
        <p class="setup-note">Google 계정 연결은 준비 중입니다.</p>
        <div class="divider"><span>시연용</span></div>
        <button id="login-button" class="primary-button" type="button">
          테스트 계정으로 로그인
        </button>
      </section>
      <section id="member-panel" aria-labelledby="member-title" hidden>
        <div class="success-mark" aria-hidden="true">✓</div>
        <h1 id="member-title">로그인되었습니다</h1>
        <p class="description">
          <strong id="member-name"></strong>님, 반갑습니다.
        </p>
        <p class="member-status">로그인 상태 · 정상</p>
        <button id="check-button" class="secondary-button" type="button">
          로그인 상태 확인
        </button>
        <button id="logout-button" class="primary-button" type="button">
          로그아웃
        </button>
      </section>
      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
        hidden
      ></p>
      <p class="footnote">2단계 로그인 시연 · 테스트 계정 사용</p>
    </main>
  </body>
</html>
